     <!-- resumo 
     O elemento input é uma parte essencial de qualquer formulário HTML. Ele é usado para coletar dados do usuário. O atributo type do input define o tipo de campo de entrada a ser exibido.

Existem muitos tipos de input, incluindo:

type="text": Para campos de texto simples.

type="password": Para campos de senha onde a entrada do usuário é obscurecida.

type="submit": Para um botão que, quando pressionado, envia o formulário ao servidor.

type="radio": Para um grupo de botões de opção, dos quais apenas um pode ser selecionado.

type="checkbox": Para caixas que podem ser marcadas ou desmarcadas.

type="email": Para campos de entrada de e-mail, que validam automaticamente o valor de entrada do usuário para garantir que seja um endereço de e-mail válido.

type="file": Para permitir que os usuários carreguem arquivos.

type="hidden": Para dados que são enviados junto com o formulário, mas não são visíveis ou editáveis pelo usuário.

type="date": Para permitir que os usuários selecionem uma data.

type="number": Para entrada numérica.

Além do atributo type, existem muitos outros atributos que podem ser usados com input, como:

value: Define o valor inicial do campo de entrada.
name: Define o nome do campo de entrada, que é usado para identificar a entrada de dados no servidor.
placeholder: Define um texto sugestivo que será exibido no campo de entrada até que o usuário comece a digitar.
required: Se este atributo estiver presente, o campo deve ser preenchido antes que o usuário possa enviar o formulário.
disabled: Se este atributo estiver presente, o campo de entrada estará desativado e o usuário não poderá interagir com ele.
readonly: Se este atributo estiver presente, o campo de entrada está somente leitura e o usuário não poderá alterar o valor.
Aqui está um exemplo de como você pode usar alguns desses atributos:

<form>
  <label for="username">Usuário:</label>
  <input type="text" id="username" name="username" required placeholder="Digite seu username">
  <input type="submit" value="Enviar">
</form> -->
