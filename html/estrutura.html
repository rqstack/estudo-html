<!DOCTYPE html> <!--define a versao do html [html5]-->

<html lang="pt-br"> <!--define o idioma do documento-->

<head> <!--metadados do documento-->
    <meta charset="UTF-8"> <!--define a codificacao de caracteres-->
    <meta http-equiv="X-UA-Compatible" content="IE=edge"> <!--garante a compatibilidade com o Internet Explorer-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--garante a responsividade em dispositivos móveis-->
    <title>Document</title> <!--titulo da pagina-->

</head>
<body> <!--corpo do documento-->

    <h1> Estrutura de um documento HTML </h1>
</body>
</html>
